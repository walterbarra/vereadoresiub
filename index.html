eze","nome":"Zezé","completo":"José de Oliveira","items":[{"g":"leis","s":"Projeto de lei","t":"Projeto de lei","n":"158/2024","st":"Aprovado","d":"2024-12-10","e":"Dispõe sobre a instalação de bebedouros públicos em pistas de caminhada e praças, destinados a pedestres, pessoas com deficiência e animais no Município de Itumbiara, Goiás, e dá outras providências.","u":"https://www.camaradeitumbiara.go.gov.br","r":5,"m":"Média: ajuste administrativo ou regra de alcance limitado (bebedouros)"},{"g":"leis","s":"Projeto de lei","t":"Projeto de lei","n":"157/2024","st":"Aprovado","d":"2024-12-10","e":"Dispõe sobre o nivelamento e a padronização das calçadas no Município de Itumbiara, Goiás, e dá outras providências.","u":"https://www.camaradeitumbiara.go.gov.br","r":8,"m":"Relevante: benefício concreto, alcance mais restrito (calçadas)"},{"g":"homenagens","s":"Título de cidadão","t":"Projeto de lei","n":"128/2024","st":"Aprovado","d":"2024-08-08","e":"Dispõe sobre concessão de título de cidadania e dá outras providências. (Wilson Jose de Resende)","u":"https://www.camaradeitumbiara.go.gov.br"},{"g":"homenagens","s":"Título de cidadão","t":"Projeto de lei","n":"110/2024","st":"Aprovado","d":"2024-06-12","e":"Dispõe sobre concessão de título de cidadania e dá outras providências. (Rodrigo Gonçalves da Silva)","u":"https://www.camaradeitumbiara.go.gov.br"},{"g":"homenagens","s":"Moção de aplausos","t":"Projeto de decreto legislativo","n":"8/2024","st":"Aprovado","d":"2024-06-12","e":"Dispõe sobre concessão de moção de aplausos e da outras providências","u":"https://www.camaradeitumbiara.go.gov.br"},{"g":"homenagens","s":"Moção de aplausos","t":"Projeto de decreto legislativo","n":"7/2024","st":"Aprovado","d":"2024-06-12","e":"Dispõe sobre concessão de moção de aplausos e da outras providências","u":"https://www.camaradeitumbiara.go.gov.br"},{"g":"homenagens","s":"Título de cidadão","t":"Projeto de lei","n":"104/2024","st":"Aprovado","d":"2024-06-04","e":"Dispõe sobre concess radeitumbiara.go.gov.br","r":3,"m":"Baixa: pouco efeito prático (carros elétricos)"},{"g":"homenagens","s":"Nome de rua, praça ou prédio","t":"Projeto de lei","n":"13/2023","st":"Aprovado","d":"2023-02-27","e":"Denomina-se logradouro público e dá outras providências (Praça Ricardo Takeo Hoshino).","u":"https://www.camaradeitumbiara.go.gov.br"},{"g":"homenagens","s":"Nome de rua, praça ou prédio","t":"Projeto de lei","n":"27/2017","st":"Retirado","d":null,"e":"Dispõe sobre denominação de logradouro público e dá outras providências","u":"https://www.camaradeitumbiara.go.gov.br"}]}];
const SRC="https://www.camaradeitumbiara.go.gov.br";
const G=[["bairros","Pedidos de melhoria nos bairros","#2e7d32","Pedidos de obra ou serviço feitos à prefeitura."],["perguntas","Perguntas e cobranças","#7b3fa0","O vereador pergunta ou cobra algo da prefeitura."],["homenagens","Homenagens","#c2410c","Parabéns, pesar, título de cidadão, nome de rua, data comemorativa."],["leis","Propostas de lei","#0b5fa5","Projetos para criar ou mudar leis."],["outros","Outros","#6b7280","O que não se encaixa nos grupos acima."]];
const GN=Object.fromEntries(G.map(g=>[g[0],g]));
const W=[["Projeto de lei complementar",10],["Derrubada de veto",9],["Outros requerimentos",8],["Projeto de lei",5],["Pedido de informação ou cumprimento de lei",5],["Pedido de obra ou serviço",5],["Projeto de resolução",5],["Projeto de decreto legislativo",5],["Voto de repúdio",1],["Declaração de utilidade pública",1],["Sessão solene",1],["Moção de apoio",1],["Data comemorativa",1],["Nome de rua, praça ou prédio",1],["Honraria (medalha, prêmio, comenda)",1],["Moção de aplausos",1],["Moção de pesar",1],["Título de cidadão",1]];
const WM=Object.fromEntries(W);
const app=document.getElementById("app");
const fd=s=>s?s.split("-").reverse().join("/"):"data não informada";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pt=i=>i.r??WM[i.s]??0;
const IND=new Set(["Projeto de lei","Projeto de lei complementar","Projeto de resolução","Projeto de decreto legislativo","Pedido de informação ou cumprimento de lei","Pedido de obra ou serviço","Derrubada de veto","Outros requerimentos"]);
DATA.forEach(v=>{v.c={};G.forEach(g=>v.c[g[0]]=0);v.items.forEach(i=>v.c[i.g]++);v.tot=v.items.length;v.pct=v.tot?v.c.homenagens/v.tot:0;v.pts=v.items.reduce((a,i)=>a+pt(i),0);v.nota=v.tot?v.pts/v.tot:0});
const fn=n=>n.toFixed(1).replace(".",",");
let sort="nota";
const SORTS={nota:["Nota (melhor para o pior)",v=>v.nota],pct:["Mais homenagens (%)",v=>v.pct],tot:["Mais propostas",v=>v.tot],leis:["Mais propostas de lei",v=>v.c.leis]};
function bar(v){return '<div class="bar" role="img" aria-label="Proporção de cada grupo">'+G.map(g=>v.c[g[0]]?`<i style="width:${v.c[g[0]]/v.tot*100}%;background:${g[2]}"></i>`:"").join("")+"</div>"}
function home(){
 const tot=DATA.reduce((a,v)=>a+v.tot,0);
 const l=[...DATA].sort((a,b)=>SORTS[sort][1](b)-SORTS[sort][1](a)||b.tot-a.tot);
 const r=[...DATA].sort((a,b)=>b.nota-a.nota||b.tot-a.tot);
 app.innerHTML=`<h1>O que os vereadores de Itumbiara estão fazendo?</h1>
 <section class="rank" aria-labelledby="rk"><h2 id="rk">Ranking geral</h2><p class="mut">Nota de 1 a 10. Quanto maior a nota, mais relevantes para a comunidade são as propostas do vereador.</p><ol>${r.map(v=>`<li><a href="#${v.id}"><span>${esc(v.nome)}${v.tot<10?" *":""}</span><b>${fn(v.nota)}</b></a></li>`).join("")}</ol><p class="mut">* Menos de 10 propostas: nota menos confiável.</p></section>
 <p>${tot} propostas de ${DATA.length} vereadores, tiradas de dados oficiais da Câmara.</p>
 <p class="mut">Mostramos só os números. Cada proposta pode ser aberta e lida.</p>
 <div class="note"><b>Importante:</b> estes dados só trazem projetos e requerimentos. Não trazem indicações (pedidos de obra nos bairros) nem votações. Por isso o primeiro grupo aparece zerado.</div>
 <h2>Como funciona a nota</h2>
 <p>Cada proposta vale de 1 a 10 pontos, conforme a tabela abaixo. Quanto mais relevante para a comunidade, mais pontos: uma moção de aplausos vale 1 e um projeto de lei complementar vale 10. A <b>nota</b> do vereador é a média dos pontos das propostas dele. Quanto <b>maior</b> a nota, mais relevantes são as propostas. O ranking vai do melhor (nota mais alta) ao pior (nota mais baixa).</p>
 <p>Projetos de lei, resoluções e pedidos ao Executivo são lidos um a um e recebem 10, 8, 5, 3 ou 1 ponto conforme a relevância para a comunidade: 10 para efeito direto em saúde, proteção ou serviços essenciais; 1 para o que é simbólico ou sem efeito para a população. O motivo aparece em cada proposta. Os demais tipos têm nota fixa, pela tabela.</p>
 <p class="mut">Os pontos são um critério do autor deste site, igual para todos. Vereadores com poucas propostas (menos de 10) têm nota menos confiável.</p>
 <h2>Ordenar por</h2>
 <div class="tabs">${Object.entries(SORTS).map(([k,s])=>`<button data-s="${k}" aria-pressed="${k==sort}">${s[0]}</button>`).join("")}</div>
 ${l.map((v,i)=>`<section class="card"><h3>${i+1}. <a href="#${v.id}">${esc(v.nome)}</a></h3>
 <p style="font-size:22px;margin:6px 0"><b>Nota ${fn(v.nota)}</b> <span class="mut">de 10 · ${v.pts} pontos em ${v.tot} propostas</span></p><p class="mut">${v.c.homenagens} são homenagens (${Math.round(v.pct*100)}%).</p>${bar(v)}
 <ul class="counts">${G.map(g=>`<li><a href="#${v.id}-${g[0]}"><span><span class="sw" style="background:${g[2]}"></span>${g[1]}</span><b>${v.c[g[0]]}</b></a></li>`).join("")}</ul></section>`).join("")}
 ${tabela()}${rules()}`;
 app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sort=b.dataset.s;home()});
}
function tabela(){const n={};DATA.forEach(v=>v.items.forEach(i=>n[i.s]=(n[i.s]||0)+1));
 return `<h2>Tabela de notas</h2><p class="mut">Quantos pontos vale cada tipo de proposta. Quanto mais relevante para a comunidade, mais pontos.</p>
 <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:16px"><thead><tr style="text-align:left;border-bottom:2px solid var(--ink)"><th style="padding:8px 4px">Tipo de proposta</th><th style="padding:8px 4px">Pontos</th><th style="padding:8px 4px">Total feito</th></tr></thead><tbody>${W.map(w=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:10px 4px">${esc(w[0])}</td><td style="padding:10px 4px">${IND.has(w[0])?"<b>1 a 10</b> <span class=\"mut\">(um a um)</span>":"<b>"+w[1]+"</b>"}</td><td style="padding:10px 4px">${n[w[0]]||0}</td></tr>`).join("")}</tbody></table></div>`}
function rules(){return `<footer><h2>Como classificamos</h2>
 <p>A mesma regra vale para todos. Olhamos o tipo do documento e o resumo (ementa) de cada proposta. Na dúvida, vai para “Outros”.</p>
 <ul><li><b>Homenagens:</b> moção de aplausos ou pesar, título de cidadão, medalha ou diploma de honra, nome de rua, praça ou prédio, dia ou semana comemorativa.</li>
 <li><b>Perguntas e cobranças:</b> pedidos de informação e cobrança de cumprimento de lei.</li>
 <li><b>Pedidos de melhoria nos bairros:</b> pedidos de obra ou serviço à prefeitura (indicações). Não há nos dados enviados.</li>
 <li><b>Propostas de lei:</b> projetos de lei, lei complementar, resolução e decreto legislativo que não sejam homenagem.</li>
 <li><b>Outros:</b> declaração de utilidade pública, voto de repúdio, moção de apoio, sessão solene, veto e demais.</li></ul>
 <p class="mut">Os resumos vieram em letras maiúsculas e foram ajustados só para facilitar a leitura. O tipo do documento (lei, resolução etc.) foi deduzido do código da planilha. Propostas repetidas na planilha foram contadas uma vez.</p>
 <p class="mut">Fonte: <a href="${SRC}">site da Câmara Municipal de Itumbiara</a>. Ainda não temos o link de cada proposta; o número leva ao site da Câmara.</p></footer>`}
function ver(id,gr){
 const v=DATA.find(x=>x.id==id);if(!v)return home();
 const st={};v.items.forEach(i=>st[i.st]=(st[i.st]||0)+1);
 app.innerHTML=`<a class="back" href="#">← Voltar para todos</a><h1>${esc(v.nome)}</h1>
 <p class="mut">${esc(v.completo)}</p><p style="font-size:22px;margin:6px 0"><b>Nota ${fn(v.nota)}</b> <span class="mut">de 10 · ${v.pts} pontos em ${v.tot} propostas</span></p>${bar(v)}
 <p class="mut">Situação: ${Object.entries(st).map(([k,n])=>n+" "+k.toLowerCase()).join(", ")}.</p>
 <h2>Histórico por grupo</h2>${G.map(g=>{const it=v.items.filter(i=>i.g==g[0]);const sub={};it.forEach(i=>sub[i.s]=(sub[i.s]||0)+1);
 return `<details id="${g[0]}" ${gr==g[0]?"open":""}><summary><span><span class="sw" style="background:${g[2]}"></span>${g[1]}</span><b>${it.length}</b></summary>
 <p class="mut">${g[3]}</p>${it.length?`<div class="subs">${Object.entries(sub).map(([k,n])=>`<span>${esc(k)}: ${n}</span>`).join("")}</div>`+it.map(i=>`<article class="it"><div class="top"><a class="num" href="${i.u}" target="_blank" rel="noopener">${esc(i.t)} ${esc(i.n)}</a><span>${fd(i.d)}</span></div><div class="tag">${esc(i.s)} (${pt(i)} pts) · ${esc(i.st)}</div>${i.m?`<div class="why"><b>Nota ${i.r}.</b> ${esc(i.m)}</div>`:""}<p>${esc(i.e)}</p></article>`).join(""):'<p class="mut">Nenhuma proposta neste grupo nos dados enviados.</p>'}</details>`}).join("")}
 ${rules()}`;
 if(gr){const e=document.getElementById(gr);e&&e.scrollIntoView()}else scrollTo(0,0);
}
function route(){const[h,g]=location.hash.slice(1).split("-");h?ver(h,g):home()}
addEventListener("hashchange",route);route();
</script></body></html>
